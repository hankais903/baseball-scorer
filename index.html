<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="棒球紀錄">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="專業的棒球比賽記錄應用程式">
    
    <title>棒球比賽紀錄</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- 樣式表 -->
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="./mobile.css">
    <link rel="stylesheet" href="./theme.css">
    
    <!-- 圖標 -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    
    <!-- 外部腳本 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- 遊戲管理模組 -->
    <script src="./game-manager.js"></script>
    <script src="./game-list-ui.js"></script>
    <script src="./game-helpers.js"></script>
    <script src="./official-sheet.js"></script>
</head>
<body>
    <div id="app-container">
        <!-- Left Panel: Controls -->
        <aside id="control-panel">
            <h2 class="panel-title" id="control-panel-title">控制面板</h2>
            <div class="panel-section" id="lineup-section">
                <form id="lineup-form">
                    <div id="top-actions">
                        <button type="button" id="new-game-btn">新比賽</button>
                    </div>
                    <h3 class="section-title">設定球員名單</h3>
                    <div id="lineup-lock-hint" class="lineup-lock-hint hidden">比賽進行中：換人請用主頁的「代打」「換投」、點壘上跑者「代跑」，或「球員調度」的守位圖；這裡只能改名字、背號、守位。</div>
                    <div id="team-settings-tabs">
                        <button type="button" class="tab-button active" data-team="a">客隊（先攻）</button>
                        <button type="button" class="tab-button" data-team="b">主隊（後攻）</button>
                    </div>
                    <div id="team-settings-content">
                        <div id="team-a-tab-content" class="tab-content active">
                            <div id="team-a-settings-container" class="team-lineup">
                                <!-- Team A lineup will be generated by JS -->
                            </div>
                        </div>
                        <div id="team-b-tab-content" class="tab-content">
                            <div id="team-b-settings-container" class="team-lineup">
                                <!-- Team B lineup will be generated by JS -->
                            </div>
                        </div>
                    </div>
                    <div id="lineup-save-status" aria-live="polite">變更會自動儲存</div>
                    <button type="button" id="apply-lineup" class="visually-hidden" tabindex="-1">套用名單</button>
                    <button type="button" id="view-box-score-btn" class="visually-hidden" tabindex="-1" aria-hidden="true">查看總表</button>
                </form>
            </div>
        </aside>

        <!-- Main Content: Scoreboard and Game State -->
        <main id="main-content">
            <!-- 上方標題列：只有棒球圖示與標題，不放功能鍵 -->
            <div class="stadium-toolbar">
                <span class="brand-ball" aria-hidden="true">⚾</span>
                <div class="brand-text">
                    <strong>棒球比賽紀錄</strong>
                    <small>Baseball Scoring Tool</small>
                </div>
            </div>
            <header id="game-info">
                <div id="game-meta-row">
                    <input type="text" id="stadium-input" class="header-input" placeholder="比賽球場">
                    <input type="date" id="game-date-input" class="header-input">
                    <select id="weather-input" class="header-input" aria-label="天氣">
                        <option value="sunny">☀ 晴</option>
                        <option value="cloudy">☁ 陰</option>
                        <option value="rainy">☂ 雨</option>
                    </select>
                </div>
            </header>
            <div id="scoreboard">
                <table>
                    <thead>
                        <tr id="scoreboard-header-row">
                            <!-- Headers will be generated by JS -->
                        </tr>
                    </thead>
                    <tbody id="scoreboard-body">
                        <!-- Rows will be generated by JS -->
                    </tbody>
                </table>
            </div>
            <div id="batter-row">
                <div id="current-batter-display">
                    <!-- Photo and text info will be generated by JS -->
                     <div id="batter-info-text">
                        <div id="batter-main-info"></div>
                        <div id="batter-last-ab"></div>
                    </div>
                </div>
                <!-- 接下來兩位打者，由 JS 填入 -->
                <div id="next-batters" aria-label="接下來的打者">
                    <div class="next-label">NEXT</div>
                    <div class="next-item on-deck"></div>
                    <div class="next-item in-hole"></div>
                </div>
            </div>
            <div class="main-actions-container">
                 <button type="button" id="undo-btn" class="main-action-btn">上一動 (復原)</button>
                 <button type="button" id="runner-action-btn" class="main-action-btn">壘間事件</button>
                 <button type="button" id="management-btn" class="main-action-btn">球員調度</button>
            </div>
            <div id="game-state-container">
                <div id="game-state-display" role="button" aria-label="紀錄打席">
                    <!-- 夜間球場背景照，只是裝飾，點擊不吃它 -->
                    <img id="stadium-bg" src="./img/stadium-night.jpg" alt="" aria-hidden="true">
                    <div id="inning-display">1局上</div>
                    <button type="button" id="game-clock" class="hidden" aria-label="比賽經過時間，點一下可暫停或結束">00:00</button>
                    <div id="clock-menu" class="modal-hidden">
                        <button type="button" id="clock-pause-btn">暫停計時</button>
                        <button type="button" id="clock-stop-btn">結束計時</button>
                    </div>
                    <div id="sbo-display">
                         <div class="sbo-row">
                            <span>OUT</span><div class="sbo-light"></div><div class="sbo-light"></div>
                        </div>
                    </div>
                    <!-- 可點擊的球場：點落點 → 依區域給結果選項 -->
                    <svg id="main-field" viewBox="18 -35 370 425" aria-label="點擊標示擊球落點">
                        <rect class="mf-wall-area" x="18" y="-35" width="370" height="36"/>
                        <image href="./img/field.png" x="0" y="0" width="412" height="402"/>
                        <!-- 整片球場（含圖上方的全壘打區）都是點擊區 -->
                        <rect class="mf-zone" x="18" y="-35" width="370" height="425" data-zone="field"/>
                        <g class="mf-base" id="mf-first" transform="translate(275,272)">
                            <circle class="mf-base-dot" r="12"/>
                            <g class="mf-runner">
                                <text class="mf-runner-name" x="0" y="-30" text-anchor="middle"></text>
                                <path class="mf-runner-body" d="M-13 14 A13 13 0 0 1 13 14 Z"/>
                                <circle class="mf-runner-head" cx="0" cy="-6" r="8"/>
                            </g>
                        </g>
                        <g class="mf-base" id="mf-second" transform="translate(202,198)">
                            <circle class="mf-base-dot" r="12"/>
                            <g class="mf-runner">
                                <text class="mf-runner-name" x="0" y="-30" text-anchor="middle"></text>
                                <path class="mf-runner-body" d="M-13 14 A13 13 0 0 1 13 14 Z"/>
                                <circle class="mf-runner-head" cx="0" cy="-6" r="8"/>
                            </g>
                        </g>
                        <g class="mf-base" id="mf-third" transform="translate(127,271)">
                            <circle class="mf-base-dot" r="12"/>
                            <g class="mf-runner">
                                <text class="mf-runner-name" x="0" y="-30" text-anchor="middle"></text>
                                <path class="mf-runner-body" d="M-13 14 A13 13 0 0 1 13 14 Z"/>
                                <circle class="mf-runner-head" cx="0" cy="-6" r="8"/>
                            </g>
                        </g>
                        <circle id="mf-mark" class="mf-mark" r="13" style="display:none"/>
                    </svg>
                    <div id="bases-container">
                        <div id="play-ball-btn" role="button" tabindex="0"><span class="pb-main">PLAY BALL</span><span class="pb-sub">點此開始比賽並開始計時</span></div>
                    </div>
                    <div id="field-result-panel" class="hidden"></div>
                </div>
            </div>
            <div id="quick-plays">
                <button type="button" data-play="三振">三振</button>
                <button type="button" data-play="四壞">四壞</button>
                <button type="button" data-play="觸身球">觸身</button>
                <button type="button" data-play="__more">其他</button>
            </div>
        </main>

        <!-- Right Panel: Event Log -->
        <aside id="event-log-container">
            <h2 class="panel-title">事件及記錄</h2>
            <div id="log-actions" class="top-actions-row">
                <button type="button" id="export-log-btn">匯出紀錄</button>
                <button type="button" id="official-sheet-btn">正式記錄表</button>
            </div>
            <div class="event-log-header">
                <div id="panel-tabs">
                    <button type="button" class="panel-tab active" data-tab="log">即時事件</button>
                    <button type="button" class="panel-tab" data-tab="situation">戰況表</button>
                    <button type="button" class="panel-tab" data-tab="team-a">客隊</button>
                    <button type="button" class="panel-tab" data-tab="team-b">主隊</button>
                </div>
            </div>
            <div id="pane-log" class="panel-pane">
                <ul id="event-log">
                    <!-- Log items will be generated by JS -->
                </ul>
            </div>
            <div id="pane-situation" class="panel-pane panel-pane-hidden"></div>
            <div id="pane-team-a" class="panel-pane panel-pane-hidden"></div>
            <div id="pane-team-b" class="panel-pane panel-pane-hidden"></div>
        </aside>
    </div>

    <!-- Play Recording Modal -->
    <div id="play-modal" class="modal-hidden">
        <div id="modal-content" class="draggable-modal-content">
            <button id="close-modal" aria-label="Close">&times;</button>
            <div id="modal-step-1">
                <h3 class="modal-drag-handle">紀錄打席結果</h3>
                <div class="modal-options">
                    <button data-step="out">出局</button>
                    <button data-step="on-base">上壘</button>
                </div>
            </div>
            <div id="modal-step-2" class="modal-hidden">
                <button class="back-button">&larr; 返回</button>
                <h3 id="modal-step-2-title" class="modal-drag-handle"></h3>
                <div id="modal-options-step-2" class="modal-options play-options">
                    <!-- Options generated by JS -->
                </div>
            </div>
            <!-- Advanced Hit Recording Steps -->
            <div id="modal-step-advanced" class="modal-hidden">
                 <button class="back-button-advanced">&larr; 返回</button>
                 <h3 id="modal-advanced-title" class="modal-drag-handle"></h3>
                 <div id="modal-advanced-options"></div>
                 <div id="modal-advanced-actions">
                    <div id="modal-advanced-summary"></div>
                    <button id="modal-advanced-done">完成</button>
                 </div>
            </div>
        </div>
    </div>
    
    <!-- Runner Action Modal -->
    <div id="runner-action-modal" class="modal-hidden">
        <div id="runner-action-modal-content" class="draggable-modal-content">
            <button id="close-runner-action-modal" aria-label="Close">&times;</button>

            <div id="runner-action-step-1">
                <h3 class="modal-drag-handle">紀錄壘間事件</h3>
                <div id="runner-action-options" class="modal-options play-options">
                    <!-- Event types generated by JS -->
                </div>
            </div>

            <div id="runner-action-step-2" class="modal-hidden">
                <button id="back-button-runner-action">&larr; 返回</button>
                <h3 id="runner-action-title-step-2" class="modal-drag-handle"></h3>
                <div id="runner-action-details">
                    <!-- Runner details generated by JS -->
                </div>
                <div id="runner-action-actions">
                    <button id="runner-action-done">完成</button>
                </div>
            </div>
        </div>
    </div>

    <!-- New Game Confirmation Modal -->
    <div id="confirm-modal" class="modal-hidden">
        <div class="confirm-modal-content draggable-modal-content">
            <p>您確定要開始一場新比賽嗎？目前的比賽紀錄將會被清除。</p>
            <div class="confirm-modal-actions">
                <button id="confirm-reset-btn">確定</button>
                <button id="cancel-reset-btn">取消</button>
            </div>
        </div>
    </div>
    
    <!-- Management/Substitution Modal (Redesigned) -->
    <!-- 情境式換人：代打／代跑／換投的選人視窗 -->
    <div id="picker-modal" class="modal-hidden">
        <div class="picker-content draggable-modal-content">
            <button id="picker-close" aria-label="Close">&times;</button>
            <h3 id="picker-title" class="modal-drag-handle">選擇球員</h3>
            <div id="picker-note" class="picker-note"></div>
            <div id="picker-list" class="picker-list"></div>
        </div>
    </div>
    <div id="management-modal" class="modal-hidden">
        <div class="management-modal-content draggable-modal-content">
            <button id="close-management-modal" aria-label="Close">&times;</button>
            <h3 class="modal-drag-handle">球員調度（守位圖）</h3>
            <div class="management-team-tabs" id="management-team-tabs">
                <!-- Tabs for Team A and B will be injected here -->
            </div>
            <div id="management-container" class="management-container">
                <!-- Management UI will be injected here -->
            </div>
        </div>
    </div>

    <!-- Box Score Modal -->
    <div id="box-score-modal" class="modal-hidden">
        <div id="box-score-content" class="draggable-modal-content">
            <button id="close-box-score-modal" aria-label="Close">&times;</button>
            <div class="modal-header-controls">
                 <h3 class="modal-drag-handle">總表</h3>
                 <div class="export-buttons-container">
                    <button id="export-box-score-btn">匯出 CSV</button>
                    <button id="export-box-score-xlsx-btn">匯出 Excel (.xlsx)</button>
                 </div>
            </div>
            <div id="box-score-tables">
                <!-- Box score tables will be generated by JS -->
            </div>
        </div>
    </div>

    <!-- Roster Load Modal -->
    <div id="load-roster-modal" class="modal-hidden">
        <div class="load-roster-modal-content draggable-modal-content">
            <button id="close-load-roster-modal" aria-label="Close">&times;</button>
            <h3 class="modal-drag-handle">讀取儲存的名單</h3>
            <div id="saved-rosters-list">
                <!-- Saved rosters will be listed here by JS -->
            </div>
        </div>
    </div>

    <!-- 紀錄檢視：正式記錄表暫時先顯示與「匯出紀錄」相同的內容，且不離開 APP -->
    <div id="log-view-modal" class="modal-hidden">
        <div class="log-view-modal-content draggable-modal-content">
            <button id="close-log-view-modal" aria-label="關閉">&times;</button>
            <h3 class="modal-drag-handle">比賽紀錄</h3>
            <pre id="log-view-text"></pre>
        </div>
    </div>

    <div id="mobile-nav" role="navigation" aria-label="切換頁面">
        <button type="button" class="nav-dot" data-index="0">名單</button>
        <button type="button" class="nav-dot active" data-index="1" aria-current="page">比賽</button>
        <button type="button" class="nav-dot" data-index="2">紀錄</button>
    </div>

    <script type="module" src="./index.tsx"></script>
    
    <!-- 遊戲管理整合 -->
    <script src="./game-integration.js"></script>
    
    <!-- PWA 安裝提示和 Service Worker 註冊 -->
    <script>
        // 註冊 Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('Service Worker 註冊成功:', registration.scope);
                    })
                    .catch(err => {
                        console.log('Service Worker 註冊失敗:', err);
                    });
            });
        }

        // PWA 安裝提示
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            // 可以在這裡顯示自定義的安裝按鈕
            console.log('可以安裝 PWA');
        });

        // 監聽安裝成功事件
        window.addEventListener('appinstalled', () => {
            console.log('PWA 安裝成功');
            deferredPrompt = null;
        });
    </script>
</body>
</html>
